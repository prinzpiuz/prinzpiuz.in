{{ if .IsPage }}
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "{{ .Permalink }}"
    },
    "headline": "{{ .Title }}",
    "description": "{{ if .Description }}{{ .Description }}{{ else }}{{ .Summary }}{{ end }}",
    "image": {
      "@type": "ImageObject",
      "url": "{{ with .Params.image }}{{ . | absURL }}{{ end }}",
      "width": 800,
      "height": 600
    },
    "author": {
      "@type": "Person",
      "name": "{{ .Site.Author.name }}"
    },
    "publisher": {
      "@type": "Organization",
      "name": "{{ .Site.Title }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ .Site.BaseURL }}images/avatar.jpeg",
        "width": 64,
        "height": 64
      }
    },
    "datePublished": "{{ .PublishDate.Format "2006-01-02T15:04:05Z07:00" | safeHTML }}",
    "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" | safeHTML }}"
  }
</script>
{{ end }}
