<!-- https://github.com/gohugoio/hugo/issues/9738 -->
<!-- export HUGOxPARAMSxGITxLAST_COMMITxSUBJECT=$(git log --follow --format="%as: %s," -- content/uses/index.md) -->
{{ if .Params.changelog }}
    <hr>
    <b>Changelog</b></br>
    {{ with site.Params.git.last_commit }}
        {{ range split .Subject "," }}
            {{ $msg := trim . " " }}
            {{ if not (findRE "(feat|fix|chore|docs|refactor|test|style)(\\(|:)" $msg) }}
                {{ $msg }}</br>
            {{ end }}
        {{ end }}
    {{ end }}
{{ end }}
